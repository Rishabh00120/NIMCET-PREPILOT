<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- PrepPilot monochrome notification badge (Android / Web Push status bar stencil) -->
  <mask id="badgeMask">
    <rect width="96" height="96" fill="white" />
    <!-- Center pinhole cutout -->
    <circle cx="48" cy="48" r="3.5" fill="black" />
    <!-- Facet dividing slits for crisp silhouette definition -->
    <line x1="48" y1="8" x2="48" y2="88" stroke="black" stroke-width="1.5" />
    <line x1="8" y1="48" x2="88" y2="48" stroke="black" stroke-width="1.5" />
  </mask>
  <g fill="#FFFFFF" mask="url(#badgeMask)">
    <!-- 4-point compass star -->
    <polygon points="48,8 56,40 88,48 56,56 48,88 40,56 8,48 40,40" />
    <!-- Center pivot ring -->
    <circle cx="48" cy="48" r="8" />
  </g>
</svg>
