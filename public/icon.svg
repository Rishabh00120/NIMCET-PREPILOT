<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="needleGradN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="needleGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="16" />
  <circle cx="256" cy="256" r="170" fill="#0B132B" stroke="#334155" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Graduation / Pilot Compass Star Motif -->
  <!-- North Needle Point -->
  <polygon points="256,96 284,240 256,256" fill="url(#needleGradN)" />
  <polygon points="256,96 228,240 256,256" fill="#1D4ED8" />

  <!-- South Needle Point -->
  <polygon points="256,416 284,272 256,256" fill="url(#needleGradS)" />
  <polygon points="256,416 228,272 256,256" fill="#64748B" />

  <!-- East Needle Point -->
  <polygon points="416,256 272,284 256,256" fill="#93C5FD" />
  <polygon points="416,256 272,228 256,256" fill="#3B82F6" />

  <!-- West Needle Point -->
  <polygon points="96,256 240,284 256,256" fill="#E2E8F0" />
  <polygon points="96,256 240,228 256,256" fill="#94A3B8" />

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="26" fill="#1E293B" stroke="#60A5FA" stroke-width="6" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
</svg>
